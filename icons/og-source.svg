<!--
  Source art for the link-preview card (icons/og-card.png, 1200×630) used by
  og:image / twitter:image on about.html. Rendered by scripts/render-icons.sh.

  Why a card and not just the app icon: a square icon is letterboxed by every
  social embed, and the preview is the only thing most people see before
  deciding whether to tap. Text is set in the system stack because headless
  Chrome — the same renderer the app runs in — resolves it to the same face the
  app's UI uses. Nothing here is loaded at runtime; the PNG is what ships.

  The barbell geometry is copied from icon-source.svg (32-unit viewBox, scaled
  3.5×). Keep the two in sync by eye — they are the same mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d0d0d"/>

  <!-- accent rule along the top edge — the app's one loud colour, used once -->
  <rect width="1200" height="8" fill="#c8ff57"/>

  <!-- barbell mark -->
  <g transform="translate(528 78) scale(4.5)">
    <rect x="10" y="14.5" width="12" height="3" rx="1.5" fill="#c8ff57"/>
    <rect x="5" y="11" width="5" height="10" rx="2" fill="#c8ff57"/>
    <rect x="22" y="11" width="5" height="10" rx="2" fill="#c8ff57"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
     text-anchor="middle">
    <text x="600" y="330" font-size="96" font-weight="800" letter-spacing="-2" fill="#c8ff57">GymOps</text>
    <text x="600" y="404" font-size="40" font-weight="700" fill="#f0f0f0">The fastest workout logger</text>
    <text x="600" y="456" font-size="40" font-weight="700" fill="#f0f0f0">that never loses your history</text>
    <text x="600" y="540" font-size="26" font-weight="600" fill="#999999">Free · Works offline · No account · Your data stays on your device</text>
  </g>
</svg>
